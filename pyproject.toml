[project]
name = "georgian-llm-pipeline"
version = "0.1.0"
description = "Georgian NLP and tokenizer"
readme = "readme.md"
authors = [
    { name = "Archil Burduli", email = "achiko@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sentencepiece==0.2.0",
    "stanza>=1.15.0",
    "transformers>=4.47.0,<5.0.0",
]

[project.scripts]
georgian-llm-pipeline = "georgian_llm_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
